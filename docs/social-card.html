<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0d0f13;color:#fff;font-family:Inter,sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(900px 500px at 85% 20%,rgba(124,108,240,.35),transparent 60%),radial-gradient(700px 400px at 10% 110%,rgba(94,225,214,.18),transparent 60%)}
  .txt{position:absolute;left:72px;top:92px;width:520px}
  .logo{width:84px;height:84px}
  h1{font:800 76px/1 'Bricolage Grotesque',sans-serif;margin:34px 0 22px;letter-spacing:-2px}
  p{font-size:27px;line-height:1.35;color:#c9c6d6;margin:0}
  .tags{position:absolute;left:72px;bottom:64px;display:flex;gap:12px}
  .tags span{border:1px solid #343a47;border-radius:999px;padding:8px 16px;font-size:18px;color:#d8d5e3}
  .shot{position:absolute;left:640px;top:96px;width:760px;border-radius:16px;border:1px solid #343a47;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
</style></head><body>
<div class="bg"></div>
<img class="shot" src="screenshot.png" alt="">
<div class="txt">
  <img class="logo" src="logo.svg" alt="">
  <h1>Motion Studio</h1>
  <p>Ton agent IA écrit l'animation, tu la retouches sur une vraie timeline, tu exportes en MP4.</p>
</div>
<div class="tags"><span>Three.js</span><span>Timeline</span><span>Export MP4</span><span>Open source</span></div>
</body></html>
